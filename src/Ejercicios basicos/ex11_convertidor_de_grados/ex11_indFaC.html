<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperaturas</title>
</head>
<body>
    <h1>Conversor de Temperaturas</h1>
    
    <div>
        <h2>Celsius a Fahrenheit</h2>
        <input type="number" id="celsius" placeholder="Grados Celsius">
        <button onclick="convertirCelsius()">Convertir</button>
        <p id="resultadoCelsius"></p>
    </div>

    <div>
        <h2>Fahrenheit a Celsius</h2>
        <input type="number" id="fahrenheit" placeholder="Grados Fahrenheit">
        <button onclick="convertirFahrenheit()">Convertir</button>
        <p id="resultadoFahrenheit"></p>
    </div>

    <script src="ex11_indFaC.js"></script>
</body>
</html>
